<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body{
            margin: 0;
            padding: 0;
        }
        .sky{
            height: 100vh;
            width: 100%;
            background-image: url(/assets/images/case-6/sky.jpg);
            background-position: center;
            position: relative;
            overflow-x: hidden;
        }
        .road{
            height: 200px;
            width: 500%;
            display: block;
            background-image: url(/assets/images/case-6/road.jpg);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;

            animation: highway 5s linear infinite;
        }
        @keyframes highway {
            100% {
                transform: translateX(-3400px);
            }
        }

        .city{
            height: 250px;
            width: 500%;
            display: block;
            background-image: url(/assets/images/case-6/city.png);
            position: absolute;
            bottom: 200px;
            left: 0;
            right: 0;
            z-index: 1;
            background-repeat: repeat-x;

            animation: city 5s linear infinite;
        }
        @keyframes city {
            100% {
                transform: translateX(-1400px);
            }
        }

        .car{
            width: 400px;
            left: 50%;
            bottom: 100px;
            transform: translateX(-50%);
            position: absolute;
            z-index: 2;
        }
        .car img{
            width: 100%;
            animation: car 1s linear infinite;
        }
        @keyframes car {
            0% {
                transform: translateY(-1px);
            }
            50% {
                transform: translateY(1px);
            }
            100% {
                transform: translateY(-1px);
            }
        }

        .wheel{
            display: flex;
            flex-direction: column;
            left: 50%;
            bottom: 178px;
            position: absolute;
            transform: translateX(-50%);
            z-index: 2;

            animation: wheel 1s linear infinite;
        }
        .back-wheel{
            left: -165px;
            position: absolute;
        }
        .front-wheel{
            left: 80px;
            position: absolute;
        }
        @keyframes wheel {
            100% {
                transform: rotate(360deg);
            }
        }

    </style>
</head>
<body>
    <div class="sky"></div>
    <div class="road"></div>
    <div class="city"></div>
    <div class="car">
        <img src="/assets/images/case-6/car.png" alt="">
    </div>
    <div class="wheel">
        <img class ="back-wheel" src="/assets/images/case-6/wheel.png" alt="">
        <img class ="front-wheel" src="/assets/images/case-6/wheel.png" alt="">
    </div>
    
</body>
</html>
