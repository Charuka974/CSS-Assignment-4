<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: hidden;
        }
        .car{
            position: absolute;
            height: 200px;
            width: 500px;
            bottom: -50px;
            left: 50%;
            transform: translate(-50%, -50%);     
        }
        #car-img{
            height: 100%;
            width: 100%;

            animation: car-bump 2s linear infinite;
        }
        .wheel{
            position: relative;
            height: 90px;
            width: 90px;
            top: -98px;

            animation-name: wheel-spin;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-delay: 1s;
        }
        #wheel-front-img{
            left: 350px;      
        }
        #wheel-rear-img{
            left: -50px;
        }

        .road{
            width: 100%;
            height: 200px;
            position: absolute;
            bottom: 0;   
            display: flex;

            animation: city 4s linear infinite;
            animation-delay: 1s;
        }
        .city{
            width: 100%;
            height: 250px;
            position: absolute;
            bottom: 200px;
            display: flex;

            animation: city 10s linear infinite;
            animation-delay: 1s;
        }

        #sky-img{
            position: absolute;
            height: 100vh;
            width: 100%;
        }

        @keyframes car-bump {
            0% {
                 transform: translateY(2px); 

            }
            50% {
                 transform: translateY(-2px); 

            }
            100% {
                 transform: translateY(2px); 

            }
        }

        @keyframes city { 
            100% {
                 transform: translateX(-50vw); 

            } 
        }

        @keyframes road {
            100% {
                 transform: translateX(-100vw); 

            } 
        }

        @keyframes wheel-spin {
            0% {
                 transform: rotate(0deg); 

            }  
            100% {
                 transform: rotate(1080deg); 

            } 
        }
        
    </style>

</head>
<body>
    <img id="sky-img" src="/assets/images/case-6/sky.jpg" alt="sky">
    

    <div class="road-slide">
        <div class="road">
            <img id="road-img" src="/assets/images/case-6/road.jpg" alt="road">
            <img id="road-img" src="/assets/images/case-6/road.jpg" alt="road">
            <img id="road-img" src="/assets/images/case-6/road.jpg" alt="road">
        </div>
    </div>
    <div class="city-slide">
        <div class="city">
            <img id="city-img" src="/assets/images/case-6/city.png" alt="city">
            <img id="city-img" src="/assets/images/case-6/city.png" alt="city">
            <img id="city-img" src="/assets/images/case-6/city.png" alt="city">
        </div>
    </div>
    
    <div class="car">
        <img id="car-img" src="/assets/images/case-6/car.png" alt="car">
        <img class="wheel" id="wheel-front-img" src="/assets/images/case-6/wheel.png" alt="wheel">
        <img class="wheel" id="wheel-rear-img" src="/assets/images/case-6/wheel.png" alt="wheel">
    </div>
    
    
    
    
    
</body>
</html>
