<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            overflow-y: hidden;
            overflow-x: hidden;
        }
        .slide-container{
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 600vw;

            display: grid;
            grid-template-columns: repeat(6, 1fr);


            animation-name: scroll-to-side;
            animation-duration: 24s;
            /* animation-timing-function: linear; */
            animation-iteration-count: infinite;
            /* animation-delay: 0s; */

        }

        .image-slide{
            padding: 0;
            margin: 0;
        }
        .slide-image{
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            padding: 0;
            margin: 0;
        }

        .slide-container{
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 600vw;

            display: grid;
            grid-template-columns: repeat(6, 1fr);


            animation-name: scroll-to-side;
            animation-duration: 24s;
            /* animation-timing-function: linear; */
            animation-iteration-count: infinite;
            /* animation-delay: 0s; */

        }

        .image-slide{
            padding: 0;
            margin: 0;
        }
        .slide-image{
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            padding: 0;
            margin: 0;
        }

        @keyframes scroll-to-side {
            0%, 12.5% {
                 transform: translateX(0vw); 
            }
            16.67%, 29.17% {
                 transform: translateX(-100vw); 
            }
            33.33%, 45.83% {
                 transform: translateX(-200vw); 
            }
            50%, 62.5% {
                 transform: translateX(-300vw); 
            }
            66.67%, 79.17% {
                 transform: translateX(-400vw); 
            }
            83.33%, 95.83% {
                 transform: translateX(-500vw); 
            }
            100% {
                 transform: translateX(0vw); 
            } 
        }
        
    </style>

</head>
<body>
    <div class="slide-container">
        <div class="image-slide">
            <img class="slide-image" src="/assets/images/case-5/1471797.jpg" alt="slide-image">
