<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            margin: 0;
            padding: 0;
        }
        .centre-droplet{
            height: 1px;
            width: 1px;
            border: 2px solid rgb(105, 11, 11);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 1;

            animation-name: increase-size;
            animation-duration: 5s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-delay: 0s;
        }

        @keyframes increase-size {
            100%{
                height: 25vw;
                width: 25vw;
                border: 1px solid rgba(255, 255, 255, 0);
                opacity: 0;
            }
        }

        /*-------------------*/

        body {
             
            height: 100vh;
            overflow: hidden;
            /* position: relative; */
        }

        /* Circle for the water drop effect */
        .water-drop {
            height: 1px;
            width: 1px;
            border: 2px solid rgb(10, 19, 119);
            border-radius: 50%;
            position: absolute;
            opacity: 1;

            background-color: rgba(14, 14, 168, 0.6);
            pointer-events: none;
            animation: dropAnimation 1s ease-out forwards;
           
        }

        /* Keyframes for the water drop animation */
        @keyframes dropAnimation {
            100% {
                /* transform: scale(2); */
                opacity: 0;
                height: 20px;
                width: 20px;
            }
        }

        /* When mouse is clicked, create the drop */
        body:active .water-drop {
            animation: dropAnimation 0.6s ease-out forwards;
        }

    </style>

</head>
<body>
    <div class="centre-droplet"></div>


    <script>
        // Create the water drop effect when the user clicks
        document.body.addEventListener('click', function (e) {
            const drop = document.createElement('div');
            drop.classList.add('water-drop');

            // Position the drop at the mouse click location
            drop.style.left = `${e.pageX -3}px`; // 50px is half the size of the drop
            drop.style.top = `${e.pageY -2}px`;

            // Set the size of the drop
            drop.style.width = '1px';
            drop.style.height = '1px';

            // Append the drop to the body
            document.body.appendChild(drop);

            // Remove the drop after the animation
            setTimeout(() => {
                drop.remove();
            }, 600); // Duration matches the animation time
        });
    </script>
    
</body>
</html>
