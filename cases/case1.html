<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
        }
        .side-menu-panel{
            position: fixed;
            width: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10vh;
        }

        .side-menu-bar{
            /* border: 1px solid black; */
            height: 8vh;
            width: 310px;
            background-color: blueviolet;
            box-shadow: 5px 5px 10px rgb(129, 89, 150);
            position: relative;

            display: flex;
            justify-content: space-between;
            align-items: center;

            left: -250px;

            transition: transform 0.8s ease-in-out;
        }
        
        .bar-1:hover{
            /* left: -10px; */
            transform: translateX(240px);
        }
        .bar-2:hover{
            /* left: -10px; */
            transform: translateX(240px);
        }
        .bar-3:hover{
            /* left: -10px; */
            transform: translateX(240px);
        }
        .bar-4:hover{
            /* left: -10px; */
            transform: translateX(240px);
        }
        .bar-5:hover{
            /* left: -10px; */
            transform: translateX(240px);
        }

        .text{
            color: white;
            margin-left: 40px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .menu-image{
            width: 5vh;
            height: 5vh;
            margin-right: 10px;
        }

    </style>


</head>
<body>

    <div class="side-menu-panel">
        <div class="side-menu-bar bar-1">
            <span class="text">Menu One</span>
            <img class="menu-image" src="/assets/images/case-1/icons8-phone-book-128.png" alt="menu image">
        </div>

        <div class="side-menu-bar bar-2">
            <span class="text">Menu Two</span>
            <img class="menu-image" src="/assets/images/case-1/icons8-ambulance-96.png" alt="menu image">
        </div>
    
        <div class="side-menu-bar bar-3">
            <span class="text">Menu Three</span>
            <img class="menu-image" src="/assets/images/case-1/icons8-city-guide-100.png" alt="menu image">
        </div>
    
        <div class="side-menu-bar bar-4">
            <span class="text">Menu Four</span>
            <img class="menu-image" src="/assets/images/case-1/icons8-layers-64.png" alt="menu image">
        </div>
    
        <div class="side-menu-bar bar-5">
            <span class="text">Menu Five</span>
            <img class="menu-image" src="/assets/images/case-1/icons8-cart-64.png" alt="menu image">
        </div>
    </div>
    


</body>
</html>
